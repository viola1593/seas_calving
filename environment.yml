# Versions match the environment the paper results were produced with.
# GPU: pick the torch wheel matching your CUDA version (paper runs: CUDA 12.1).
name: seascalving
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch==2.5.1
      - torchvision==0.20.1
      - lightning==2.2.1
      - numpy==2.4.4
      - pandas==3.0.0
      - scipy==1.17.0
      - scikit-image==0.26.0
      - scikit-learn==1.8.0
      - zarr==3.1.6
      - xarray==2026.1.0
      - pyarrow==24.0.0
      - geopandas==1.1.2
      - shapely==2.1.2
      - pyproj==3.7.2
      - rasterio==1.4.4
      - rioxarray==0.19.0
      - cartopy==0.25.0
      - matplotlib==3.10.8
      - pyyaml==6.0.2
      - tqdm==4.66.5
      - captum==0.8.0
      - tensorboard==2.20.0
      - wandb==0.24.1
      - pytest==9.0.3
